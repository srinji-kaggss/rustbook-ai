      - name: "unnamed"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ env.KEEL_HEAD_SHA }}"
      - name: "Compile and compare canonical eval JSONL"
        if: ${{ always() }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          cat > "$KEEL_EVIDENCE_DIR/eval.jsonl" <<'KEEL_EVAL'
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"stack-position","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.stack-position.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"change-scope","outputs":{"code_changed":"${{ needs.change-scope.outputs.code_changed }}"},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.change-scope.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"build","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.build.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"ci-plan-current","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.ci-plan-current.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"tier-deps","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.tier-deps.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"fmt","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.fmt.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"tests","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.tests.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"clippy","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.clippy.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"verify","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.verify.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"scan","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.scan.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"reachability","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.reachability.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"zero-gate","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.zero-gate.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"semantic-floor","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.semantic-floor.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"false-negative-budget","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.false-negative-budget.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"contract-reach-budget","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.contract-reach-budget.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"kani-verify","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.kani-verify.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"property-and-loom-verify","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.property-and-loom-verify.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"condition-coverage-verify","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.condition-coverage-verify.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"mcdc-coverage-verify","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.mcdc-coverage-verify.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"mutation-test-verify","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.mutation-test-verify.result }}"}
          {"base_sha":"${{ env.KEEL_BASE_SHA }}","head_sha":"${{ env.KEEL_HEAD_SHA }}","job_id":"semantic-review-verify","outputs":{},"plan_sha256":"87197816de07423b8603dd36ee3f9c77fd1d9705ae2558054db2720cbcc83dd9","schema":"keel.ci.eval/v1","status":"${{ needs.semantic-review-verify.result }}"}
          KEEL_EVAL
          local_eval="$HOME/.keel-ci/eval/$KEEL_HEAD_SHA.jsonl"
          if [ ! -f "$local_eval" ]; then
            echo "FAIL eval parity: exact local evidence is missing: $local_eval" >&2
            exit 1
          fi
          if ! cmp -s "$local_eval" "$KEEL_EVIDENCE_DIR/eval.jsonl"; then
            echo "FAIL eval parity: local and GitHub canonical results differ" >&2
            diff -u "$local_eval" "$KEEL_EVIDENCE_DIR/eval.jsonl" >&2 || true
            exit 1
          fi
          cp "$KEEL_EVIDENCE_DIR/eval.jsonl" eval.jsonl
          cat eval.jsonl
      - name: "Upload eval log"
        if: ${{ always() }}
        uses: "actions/upload-artifact@v4"
        with:
          if-no-files-found: "error"
          name: "eval-log"
          path: "eval.jsonl"

  cleanup:
    name: "Cleanup — fresh state for next run"
    runs-on: ["self-hosted"]
    needs: ["eval-log"]
    if: ${{ always() }}
    timeout-minutes: 1
    steps:
      - name: "Remove only current-run work; preserve evidence"
        if: ${{ always() }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          rm -rf "$KEEL_RUN_ROOT/work" "$CARGO_TARGET_DIR" "$KEEL_RUN_ROOT/condition" "$KEEL_DIFFERENTIAL_DIR"
          rm -f ./*.profraw
          echo "Cleaned only current-run work; evidence retained at $KEEL_EVIDENCE_DIR"


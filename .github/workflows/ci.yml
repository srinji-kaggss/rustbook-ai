          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          ./scripts/tests/mutation-coverage-isolation-selftest.sh
      - name: "Prove the mutation admission gate refuses an oversized diff (self-test)"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          ./scripts/tests/mutation-coverage-admission-selftest.sh
      - name: "Record docs-only N/A"
        if: ${{ needs.change-scope.outputs.code_changed != 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          echo "N/A  mutation testing: docs-only change; no Rust source can be mutated"
      - name: "Determine mutation base"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          echo "KEEL_MUTATION_BASE=$KEEL_BASE_REF" >> "$GITHUB_ENV"
      - name: "Run PR-scoped mutation testing"
        id: "mutation"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export KEEL_COMPUTE_SLOTS="12"
          export KEEL_MUTATION_TIMEOUT="45"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          ./scripts/mutation-coverage.sh
        continue-on-error: true
        env:
          KEEL_MUTATION_OUTPUT: "${{ runner.temp }}/keel-mutation"
      - name: "Upload mutation outcomes"
        if: ${{ always() && needs.change-scope.outputs.code_changed == 'yes' }}
        uses: "actions/upload-artifact@v4"
        with:
          if-no-files-found: "warn"
          name: "mutation-outcomes-${{ github.run_id }}"
          path: "${{ runner.temp }}/keel-mutation/mutants.out"
          retention-days: "14"
      - name: "Refuse survived or indeterminate mutants"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' && steps.mutation.outcome != 'success' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          echo "FAIL mutation testing did not establish that every viable changed-code mutant was caught." >&2
          echo "     Read the mutation-outcomes artifact for missed, timeout, and unviable cases." >&2
          exit 1

  semantic-review-verify:
    name: "Tier 6 — semantic diff review"
    runs-on: ["self-hosted"]
    needs: ["mutation-test-verify"]
    timeout-minutes: 4
    steps:
      - name: "unnamed"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ env.KEEL_HEAD_SHA }}"
          fetch-depth: "0"
      - name: "Claim exact diff and model identity before spending"
        id: "paid-claim"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          "$CARGO_TARGET_DIR/release/keel-ci-plan" claim-paid >> "$GITHUB_OUTPUT"
      - name: "Preflight — DeepSeek primary, local llama.cpp fallback"
        if: ${{ steps.paid-claim.outputs.run == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          # Source the key from the runner .env file.
          # All 4 runners share /Users/srinji and each has its own .env there.
          ENV_FILE=""
          for d in ~/actions-runner-keel ~/actions-runner-keel-2 ~/actions-runner-keel-3 ~/actions-runner-keel-4; do
            if [ -f "$d/.env" ]; then
              ENV_FILE="$d/.env"
              break
            fi
          done
          
          if [ -n "$ENV_FILE" ]; then
            # Export DEEPSEEK_API_KEY into the job environment so keel-review sees it
            DEEPSEEK_API_KEY="$(grep '^DEEPSEEK_API_KEY=' "$ENV_FILE" | cut -d= -f2-)"
            export DEEPSEEK_API_KEY
            echo "::add-mask::$DEEPSEEK_API_KEY"
            echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" >> "$GITHUB_ENV"
            echo "Found DEEPSEEK_API_KEY in $ENV_FILE"
          else
            echo "WARN No runner .env found — DeepSeek unavailable, will try local fallback"
          fi
          
          # Test DeepSeek first (primary)
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            echo "Testing DeepSeek connectivity..."
            if curl -sf -m 15 https://api.deepseek.com/v1/models \
              -H "Authorization: Bearer $DEEPSEEK_API_KEY" >/dev/null 2>&1; then
              echo "OK   Tier 6: DeepSeek reachable, using as primary"
              exit 0
            fi
            echo "WARN DeepSeek unreachable, falling back to local reviewer"
          fi
          
          # Fall back to local Ollama (was llama-server:8082; Qwen3-8B GGUF
          # file was deleted 2026-08-12 leaving the server with a stale mmap).
          if curl -sf -m 10 http://127.0.0.1:11434/v1/models >/dev/null 2>&1; then
            echo "OK   Tier 6: local reviewer answering on 127.0.0.1:11434 (fallback: ollama qwen3:8b)"
            exit 0
          fi
          
          echo "FAIL Tier 6: neither DeepSeek nor the local reviewer is available." >&2
          echo "     DeepSeek: check the API key in the runner .env file" >&2
          echo "     Local:    nothing is serving http://127.0.0.1:11434 (Ollama)" >&2
          echo "" >&2
          echo "     Start Ollama and pull the model:" >&2
          echo "       ollama serve &" >&2
          echo "       ollama pull qwen3:8b" >&2
          echo "" >&2
          echo "     Then check: curl -s http://127.0.0.1:11434/v1/models" >&2
          exit 1
      - name: "Determine base ref"
        id: "base"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          echo "ref=$KEEL_BASE_REF" >> "$GITHUB_OUTPUT"
      - name: "Run semantic-review.sh"
        if: ${{ steps.paid-claim.outputs.run == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          ./scripts/semantic-review.sh "$GITHUB_WORKSPACE" "$KEEL_BASE_REF" HEAD
      - name: "Record successful paid review identity"
        if: ${{ steps.paid-claim.outputs.run == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          "$CARGO_TARGET_DIR/release/keel-ci-plan" finish-paid


          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          rustup run "$(./scripts/pinned-channel.sh)" cargo clippy --manifest-path keel-core/Cargo.toml --release --all-targets -- -D warnings
      - name: "Record docs-only N/A"
        if: ${{ always() }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          if [ "${{ needs.change-scope.outputs.code_changed }}" = "yes" ]; then
            echo "scope: code changed -> heavy tier ran"
          else
            echo "scope: docs-only -> heavy tier skipped (explicit N/A)"
          fi
      - name: "keel-kb"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          rustup run "$(./scripts/pinned-channel.sh)" cargo clippy --manifest-path keel-kb/Cargo.toml --release --all-targets -- -D warnings

  verify:
    name: "Tier 1 — deterministic floor (keel-ci)"
    runs-on: ["self-hosted"]
    needs: ["build", "change-scope"]
    timeout-minutes: 5
    steps:
      - name: "unnamed"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ env.KEEL_HEAD_SHA }}"
          fetch-depth: "0"
      - name: "Verify keel-ci binary exists (pre-built by build job)"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          if [[ ! -x "$CARGO_TARGET_DIR/release/keel-ci" ]]; then
            echo "ERROR: keel-ci binary not found at $CARGO_TARGET_DIR/release/keel-ci" >&2
            exit 1
          fi
      - name: "Run Keel CI runner"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          "$CARGO_TARGET_DIR/release/keel-ci"
        working-directory: "${{ github.workspace }}"
      - name: "Record docs-only N/A"
        if: ${{ always() }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          if [ "${{ needs.change-scope.outputs.code_changed }}" = "yes" ]; then
            echo "scope: code changed -> heavy tier ran"
          else
            echo "scope: docs-only -> heavy tier skipped (explicit N/A)"
          fi
      - name: "Stage Tier 1 evidence for the run eval log"
        if: ${{ always() }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          export KEEL_EVIDENCE_DIR="$KEEL_EVIDENCE_DIR"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          mkdir -p "$KEEL_EVIDENCE_DIR"
          if [[ -d .ci-runs ]]; then
            cp -a .ci-runs/. "$KEEL_EVIDENCE_DIR/"
          fi

  scan:
    name: "Tier 2 — keel-scan (changed files)"
    runs-on: ["self-hosted"]
    needs: ["build"]
    timeout-minutes: 5
    steps:
      - name: "unnamed"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ env.KEEL_HEAD_SHA }}"
          fetch-depth: "0"
      - name: "Verify keel-scan binary exists (pre-built by build job)"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"

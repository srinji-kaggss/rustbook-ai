# @generated by keel-ci-plan from ci/keel-ci.toml; DO NOT EDIT.
name: "Keel CI"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  actions: "read"
  contents: "read"
  pull-requests: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  DEEPSEEK_MODEL: "deepseek-chat"
  FORGE_FALLBACK_ENDPOINT: "http://127.0.0.1:11434/v1"
  FORGE_FALLBACK_MODEL: "qwen3:8b"
  KEEL_BASE_REF: "${{ github.event.pull_request.base.sha || github.event.before || github.sha }}"
  KEEL_BASE_SHA: "${{ github.event.pull_request.base.sha || github.event.before || github.sha }}"
  KEEL_COMPUTE_SLOTS: "4"
  KEEL_EVENT: "${{ github.event_name }}"
  KEEL_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
  KEEL_REPOSITORY: "${{ github.repository }}"
  KEEL_RUN_ID: "${{ github.run_id }}"
  KEEL_WORKSPACE: "${{ github.workspace }}"
  RAYON_NUM_THREADS: "4"

defaults:
  run:
    shell: "bash"

jobs:
  stack-position:
    name: "Stack -- bottom of the stack only"
    runs-on: ["self-hosted"]
    timeout-minutes: 2
    steps:
      - name: "Refuse a PR whose base is itself an open PR"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -u
          if [ "$EVENT" != "pull_request" ]; then
            echo "OK   $EVENT carries no stack position; the tiers run."
            exit 0
          fi
          blocker="$(gh pr list --repo "$REPO" --state open --head "$BASE" --json number,title --jq '.[0] | select(.) | "#\(.number) \(.title)"' 2>/dev/null || true)"
          if [ -z "$blocker" ]; then
            echo "OK   base '$BASE' has no open pull request, so this is the bottom."
            exit 0
          fi
          echo "FAIL This PR is not the bottom of its stack." >&2
          echo "     Its base '$BASE' is still an open pull request: $blocker" >&2
          echo "     The tiers below are skipped on purpose. Four runners and one" >&2
          echo "     local reviewer cannot serve nine PRs at once, and reviewing" >&2
          echo "     against a base that has not landed proves nothing. Merge" >&2
          echo "     $blocker first; this PR then becomes the bottom and runs." >&2
          exit 1
        env:
          BASE: "${{ github.event.pull_request.base.ref }}"
          EVENT: "${{ github.event_name }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          REPO: "${{ github.repository }}"

  change-scope:
    name: "Scope — code vs docs only"
    runs-on: ["self-hosted"]
    timeout-minutes: 3
    outputs:
      code_changed: "${{ steps.scope.outputs.code_changed }}"
    steps:
      - name: "unnamed"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ env.KEEL_HEAD_SHA }}"
          fetch-depth: "0"
      - name: "Resolve the scope base ref"
        id: "base"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          echo "SCOPE_BASE=$KEEL_BASE_REF" >> "$GITHUB_ENV"
      - name: "Prove the differential gate can emit BOTH verdicts (self-test)"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          ./scripts/tests/keel-differential-selftest.sh
      - name: "Decide whether code changed (or docs only)"
        id: "scope"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          set -eu
          ./scripts/ci/keel-differential.sh "$SCOPE_BASE" "$KEEL_DIFFERENTIAL_DIR" | tee "$RUNNER_TEMP/keel-differential.out"
          eval "$(grep -E '^(code_changed|differential_dir)=' "$RUNNER_TEMP/keel-differential.out")"
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
        shell: "bash"

  build:
    name: "Build — cargo test --all-targets (shared)"
    runs-on: ["self-hosted"]
    needs: ["stack-position", "change-scope"]
    timeout-minutes: 7
    steps:
      - name: "unnamed"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ env.KEEL_HEAD_SHA }}"
      - name: "Clean shared target (fresh build, no carryover)"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          rm -rf "$CARGO_TARGET_DIR"
          mkdir -p "$CARGO_TARGET_DIR"
      - name: "Build all keel-core targets (bins + tests + lib)"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          rustup run "$(./scripts/pinned-channel.sh)" cargo test --manifest-path keel-core/Cargo.toml --release --all-targets --no-run
          rustup run "$(./scripts/pinned-channel.sh)" cargo build --manifest-path keel-core/Cargo.toml --release --bins
      - name: "Build all keel-kb targets"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          rustup run "$(./scripts/pinned-channel.sh)" cargo test --manifest-path keel-kb/Cargo.toml --release --all-targets --no-run
      - name: "Build release bins (docs-only path)"
        if: ${{ needs.change-scope.outputs.code_changed == 'no' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          rustup run "$(./scripts/pinned-channel.sh)" cargo build --manifest-path keel-core/Cargo.toml --release --bin keel-scan --bin keel-review --bin keel-ci
          rustup run "$(./scripts/pinned-channel.sh)" cargo build --manifest-path keel-kb/Cargo.toml --release

  ci-plan-current:
    name: "Canonical CI — generated workflow is current"
    runs-on: ["self-hosted"]
    needs: ["build"]
    timeout-minutes: 2
    steps:
      - name: "unnamed"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ env.KEEL_HEAD_SHA }}"
      - name: "Regenerate and byte-check GitHub Actions"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          "$CARGO_TARGET_DIR/release/keel-ci-plan" check

  tier-deps:
    name: "Preflight — tier deps tracked in git"
    runs-on: ["self-hosted"]
    needs: ["stack-position"]
    timeout-minutes: 3
    steps:
      - name: "unnamed"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ env.KEEL_HEAD_SHA }}"
          fetch-depth: "0"
      - name: "Check tier dependencies are tracked in git"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          ./scripts/check-tier-deps.sh "${{ github.workspace }}"
      - name: "Check every Buck2 target CI asks for exists"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          ./scripts/ci/buck-tier-targets.sh

  fmt:
    name: "Format — rustfmt (both workspaces)"
    runs-on: ["self-hosted"]
    needs: ["stack-position"]
    timeout-minutes: 3
    steps:
      - name: "unnamed"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ env.KEEL_HEAD_SHA }}"
      - name: "Self-test the fmt gate (proves it can still fail)"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          ./scripts/tests/fmt-check-selftest.sh
      - name: "Check formatting"
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          ./scripts/fmt-check.sh

  tests:
    name: "Tier 0 — cargo test (both workspaces)"
    runs-on: ["self-hosted"]
    needs: ["build", "change-scope"]
    timeout-minutes: 5
    steps:
      - name: "unnamed"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ env.KEEL_HEAD_SHA }}"
      - name: "keel-core, unit and integration"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          rustup run "$(./scripts/pinned-channel.sh)" cargo test --manifest-path keel-core/Cargo.toml --release --all-targets
      - name: "keel-kb"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          rustup run "$(./scripts/pinned-channel.sh)" cargo test --manifest-path keel-kb/Cargo.toml --release --all-targets
      - name: "Record docs-only N/A"
        if: ${{ always() }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          if [ "${{ needs.change-scope.outputs.code_changed }}" = "yes" ]; then
            echo "scope: code changed -> heavy tier ran"
          else
            echo "scope: docs-only -> heavy tier skipped (explicit N/A)"
          fi
      - name: "Doc tests, which --all-targets does not run"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}
        run: |
          set -e
          export KEEL_RUN_ROOT="$HOME/.keel-ci/runs/$KEEL_RUN_ID"
          export KEEL_DIFFERENTIAL_DIR="$KEEL_RUN_ROOT/differential"
          export KEEL_EVIDENCE_DIR="$KEEL_RUN_ROOT/evidence"
          export KEEL_KERNEL_PATH="$HOME/logic-os-kernel/kernel"
          export KEEL_SIGNING_KEY_PATH="$HOME/.keel-ci/signing_key"
          export CARGO_TARGET_DIR="$KEEL_RUN_ROOT/target"
          mkdir -p "$KEEL_RUN_ROOT/work" "$KEEL_EVIDENCE_DIR" "$KEEL_DIFFERENTIAL_DIR"
          rustup run "$(./scripts/pinned-channel.sh)" cargo test --manifest-path keel-core/Cargo.toml --release --doc

  clippy:
    name: "Tier 0 — cargo clippy (deny warnings)"
    runs-on: ["self-hosted"]
    needs: ["build", "change-scope"]
    timeout-minutes: 5
    steps:
      - name: "unnamed"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ env.KEEL_HEAD_SHA }}"
      - name: "keel-core"
        if: ${{ needs.change-scope.outputs.code_changed == 'yes' }}

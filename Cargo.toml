[package]
name = "rustbook-ai"
version = "0.3.0"
edition = "2021"
description = "AI-first computational notebook — DAG-based cell graph, mouse-driven TUI, structured AI command protocol, markdown cells"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
rhai = "1"
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
